id           = "yogaeru/mango_layout"
name         = "Mango Layout Switcher"
version      = "1.0.1"
min_noctalia = "5.0.0"
author       = "yogaeru"
license      = "MIT"
plugin_api   = 14
icon         = "layout-filled"
description  = "Layout switcher for MangoWC"


[[setting]]
key             = "closeOnSelect"
type            = "bool"
label_key       = "settings.closeOnSelect.label"
description_key = "settings.closeOnSelect.description"
default         = false

[[setting]]
key             = "compactLabel"
type            = "bool"
label_key       = "settings.compactLabel.label"
description_key = "settings.compactLabel.description"
default         = false

[[widget]]
id = "mango_layout"
entry = "widget.luau"

  [[widget.setting]]
  key             = "dynamicIcon"
  type            = "bool"
  label_key       = "settings.dynamicIcon.label"
  description_key = "settings.dynamicIcon.description"
  default         = false
  
  [[widget.setting]]
  key             = "icon"
  type            = "glyph"
  label_key       = "settings.icon.label"
  description_key = "settings.icon.description"
  default         = "layout-filled"
  visible_when    = { key = "dynamicIcon", values = ["false"] }

[[panel]]
id = "main"
entry = "panel.luau"
width = 420
height = 410
placement = "floating"
position = "center"